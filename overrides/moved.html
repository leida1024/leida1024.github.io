{% extends "main.html" %}

{% block extrahead %}
  {{ super() }}
  <meta http-equiv="refresh" content="0; url={{ page.meta.redirect_to | url }}">
{% endblock %}
{% block content %}
  {{ page.content }}
  <script>
    window.location.replace({{ page.meta.redirect_to | url | tojson }})
  </script>
{% endblock %}

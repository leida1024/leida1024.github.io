site_name: Notes
site_description: 问题记录与文章
site_url: https://leida1024.github.io/
repo_url: https://github.com/leida1024/leida1024.github.io
repo_name: leida1024/leida1024.github.io
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2023-2026 leida1024

theme:
  name: material
  custom_dir: overrides
  language: zh
  font: false
  icon:
    logo: material/console-line
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.expand
    - navigation.path
    - navigation.footer
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色模式

nav:
  - 主页: index.md
  - 专题: topics/index.md

hooks:
  - hooks.py

plugins:
  - blog:
      blog_dir: .
      post_dir: articles
      post_url_format: "{categories}/{slug}"
      post_date_format: "yyyy-MM-dd HH:mm:ss XXX"
      post_excerpt: required
      archive_name: 时间线
      archive_url_format: "timeline/{date}"
      categories_name: 分类
      categories_url_format: "category/{slug}"
      authors: false
      pagination: false
  - search:
      lang:
        - zh
        - en

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/sort-posts.js
  - javascripts/comments.js
  - javascripts/category-tree.js
  - javascripts/timeline-tree.js

extra:
  category_labels:
    Network: 网络
    Software: 软件
    Office: 办公
    Security: 安全
    Reading: 阅读
    Site: 站点
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/leida1024
      name: leida1024 on GitHub

strict: true
